<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="style.css">
        <script src="index.js" defer></script>
    </head>
    <body>
        <div class="mainBox">
            <h1 class="generateText">Generate a</h1>
            <h1 class="randomPasswordText">random password</h1>
            <p class="paragraphText">Never use an insecure password again</p>
            <button class="generateButton" onclick="showPasswords()">Generate Passwords</button>
            <div class="Buttons">
                <p class="passLength">Password length:</p>
                <button class="lengthButton" onclick="passwordLengthSet(10)">10</button>
                <button class="lengthButton" onclick="passwordLengthSet(12)">12</button>
                <button class="lengthButton" onclick="passwordLengthSet(14)">14</button>
                <button class="lengthButton" onclick="passwordLengthSet(16)">16</button>
            </div>
            <p class="dividingLine"></p>
            <div class="passwordsBox">
                <p class="passwordSpace" id="passwordElement"></p>
            </div>
            <p class="dividingLine"></p>
            <p class="passwordHistory">Password History:</p>
            <ul id="password-history-ul-el" class="passHistoryUl"></ul>
        </div>
    </body>
</html>
